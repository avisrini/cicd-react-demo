name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - master
      - staging

# Read-only token. Note this is `pull_request`, not `pull_request_target`, so
# fork PRs get no secrets and cannot escalate from the untrusted code they run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndTest:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        # --frozen-lockfile so CI fails on lockfile drift instead of silently
        # resolving versions that differ from the audited yarn.lock.
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test
